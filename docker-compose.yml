# ==============================================================================
# FairFold — local and single-host deployment
# ==============================================================================
# Specified in FAIRFOLD_Project_Architecture_and_Requirements.md §6.1. Added
# 2026-10-04.
#
# Differences from §6.1, each with a reason:
#   * `clamav` is present as a real service. The upload path rejects a file when
#     ClamAV is unreachable, so without it every resume upload fails.
#   * `healthcheck` on every service that has one to check. `postgres`, `redis` and
#     `clamav` are genuinely probed; `django` inherits the Dockerfile's HTTP probe;
#     `celery` and `celery-beat` **disable** it (see below).
#   * `restart: unless-stopped`, so a host reboot does not leave the stack down.
# ==============================================================================

name: fairfold

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 17 + pgvector
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fairfold}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-fairfold_dev}
      # Checksums catch a silent corruption from a bad shutdown. Costs ~10% write
      # throughput, which is irrelevant at this project's scale.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fairfold} -d ${POSTGRES_DB:-fairfold_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Redis — cache and Celery broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly persists the task queue. Without it, a restart discards queued
    # screening and email jobs silently — they were accepted, and nobody is told.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage (REQ-FR-010, Arch Doc §6.1)
  # ---------------------------------------------------------------------------
  # MinIO publishes no anonymous images: `minio/minio` is gone from Docker Hub
  # and quay.io/minio/minio answers 401 without a login. Run `docker login
  # quay.io` once (README troubleshooting) or point MINIO_IMAGE at a registry
  # your machine is authenticated to.
  #
  # `latest` is the default because a pinned release tag cannot be pulled or
  # verified without an account. Set MINIO_IMAGE to a release tag in any
  # environment where reproducibility matters.
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required — see .env.example}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required — see .env.example}
      # MinIO's own CORS allow-list, and the one that actually answers a browser
      # preflight here: `PutBucketCors` returns NotImplemented on MinIO, so
      # `manage.py ensure_storage` applies a bucket policy only where the
      # endpoint supports it (AWS S3, Cloudflare R2). Same origins either way.
      MINIO_API_CORS_ALLOW_ORIGIN: ${S3_CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      # curl ships in the official image (Dockerfile.release copies a static
      # curl in). /minio/health/live is liveness only; /minio/health/cluster
      # would fail in single-node mode and restart a healthy container.
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # ClamAV
  # ---------------------------------------------------------------------------
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    ports:
      - "${CLAMD_PORT:-3310}:3310"
    # Generous start_period: freshclam downloads its signature definitions on
    # first boot, which can take several minutes. A short period marks the
    # container unhealthy and the first resume upload is rejected.
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ---------------------------------------------------------------------------
  # Django
  # ---------------------------------------------------------------------------
  django:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    command:
      - sh
      - -c
      - |
          # A YAML block scalar keeps newlines, so each gunicorn option MUST end
          # in a backslash. Without them the shell runs `exec gunicorn
          # config.wsgi:application` alone -- gunicorn falls back to its default
          # 127.0.0.1:8000 bind, the published port reaches nothing, and the
          # remaining lines are commands that never run because exec already
          # replaced the shell. The container still reports healthy, because the
          # Dockerfile probe curls localhost inside the container.
          set -e
          python manage.py migrate --noinput
          python manage.py seed
          # Creates the bucket and its CORS policy if MinIO is configured
          # (no-op otherwise) and never invents credentials. Runs before
          # collectstatic so the stack is not reported ready while the object
          # store is unreachable.
          python manage.py ensure_storage
          # DEBUG builds local.py, which serves /static/ from STATIC_ROOT through
          # config/urls.py. STATIC_ROOT is a mounted volume that starts empty, so
          # without this every stylesheet request is a 404 and the site renders
          # unstyled.
          python manage.py collectstatic --noinput
          exec gunicorn config.wsgi:application \
            --bind 0.0.0.0:8000 \
            --workers 3 \
            --timeout 120 \
            --access-logfile - \
            --error-logfile - \
            --forwarded-allow-ips '*'
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgresql://${POSTGRES_USER:-fairfold}:${DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-fairfold_dev}
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      # A SEPARATE Redis database from the broker. A FLUSHDB on one must never
      # discard queued tasks in the other.
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CLAMD_HOST: clamav
      CLAMD_PORT: 3310
      # Object storage, read from the MinIO service rather than from .env so
      # there is one place a development credential is written. Inside the
      # Compose network the endpoint is the service name; the browser reaches
      # the published port, so presigned upload URLs are signed against that
      # second host (batch 1.22, REQ-FR-010). Signing is offline, so this is a
      # host only the browser needs to resolve.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      AWS_STORAGE_BUCKET_NAME: ${MINIO_BUCKET:-fairfold-media}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_PORT:-9000}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
      S3_CORS_ALLOWED_ORIGINS: ${S3_CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      # Read from the host .env rather than re-declared here, so there is one
      # place a secret is written.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      EMAIL_BACKEND_URL: ${EMAIL_BACKEND_URL:?EMAIL_BACKEND_URL is required}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?DEFAULT_FROM_EMAIL is required}
      # Optional here on purpose: only production.py requires a DSN, and
      # .env.example leaves it empty for local development. Making it mandatory
      # in Compose means `cp .env.example .env && docker compose up` dies on an
      # interpolation error before the stack ever starts.
      SENTRY_DSN: ${SENTRY_DSN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    # Inherits the Dockerfile HEALTHCHECK, which curls /health/. That endpoint
    # checks no dependency on purpose: making the liveness probe verify PostgreSQL
    # means a brief database blip restarts every container in the stack.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # service_healthy, not just service_started: migrations run in this
      # container's command, and a migration touching a VectorField fails against
      # a Postgres that has not finished loading pgvector.
      clamav:
        condition: service_healthy
      # `ensure_storage` in the command above creates the bucket, so it must not
      # run before MinIO answers. Without this the container exits 1 on the first
      # start and `restart: unless-stopped` turns that into a crash loop.
      minio:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Celery worker
  # ---------------------------------------------------------------------------
  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    # --concurrency=2: the queue is AI calls and email, both network-bound, so
    # more workers buy latency rather than throughput while each holds a database
    # connection open.
    command: celery -A config worker --loglevel=INFO --concurrency=2
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgresql://${POSTGRES_USER:-fairfold}:${DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-fairfold_dev}
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CLAMD_HOST: clamav
      CLAMD_PORT: 3310
      # The worker will read and delete stored files in batch 1.20. It reads the
      # same settings module as the web process, so a filesystem backend here
      # while the web process uses S3 would make a scan look at a file that does
      # not exist.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      AWS_STORAGE_BUCKET_NAME: ${MINIO_BUCKET:-fairfold-media}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Optional locally — see the `django` service above.
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - media_data:/app/media
    # The image's HEALTHCHECK curls http://localhost:8000/health/. This container
    # runs no HTTP server, so that probe can only ever fail — and a permanently
    # unhealthy container is worse than an unchecked one: `docker compose ps`
    # reports a problem that does not exist, and anything gated on worker health
    # never starts. Disabled explicitly rather than inherited.
    healthcheck:
      disable: true
    depends_on:
      django:
        # service_started, not healthy: the worker can start while migrations are
        # still running, and a worker that starts first simply retries.
        condition: service_started
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Celery beat — scheduled tasks (digest emails, quota resets, retention sweeps)
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    # Exactly ONE beat container. Two schedulers fire every scheduled task twice,
    # which for a retention sweep means deleting twice and for an email means
    # sending twice.
    #
    # --schedule is explicit because the runtime image runs as `fairfold` (uid
    # 1000) while /app is owned by root: beat's default write of
    # ./celerybeat-schedule fails with EACCES, exits 1, and `restart:
    # unless-stopped` turns that into an endless crash loop with no scheduled
    # task ever running. /app/run is created and chowned in the Dockerfile.
    command: celery -A config beat --loglevel=INFO --schedule=/app/run/celerybeat-schedule
    # The schedule file records each task's last run. Without a volume it is
    # discarded on every recreate, and beat re-fires everything on first tick.
    volumes:
      - beat_data:/app/run
    # No HTTP server here either — see the `celery` service above.
    healthcheck:
      disable: true
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgresql://${POSTGRES_USER:-fairfold}:${DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-fairfold_dev}
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  # Object storage. Without a volume, `docker compose down` (not `-v`) keeps it,
  # but a recreate of the container would otherwise start with no objects and a
  # bucket that `ensure_storage` silently re-creates empty.
  minio_data:
  # Celery beat's schedule file. See the `celery-beat` service.
  beat_data: