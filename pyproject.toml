# ==============================================================================
# FairFold — Python tooling configuration
# ==============================================================================
# black, isort and mypy are configured here because the CI workflow in
# FAIRFOLD_Project_Architecture_and_Requirements.md §6.5 invokes all three from
# the repository root and expects this file to exist. Its absence makes those
# three steps fail on a lint error that is not a lint error.
#
# Line length is 88 (black's default) even though flake8 is invoked with
# `--max-line-length=120`. The two differ on purpose: black reformats to 88, so
# allowing 120 in flake8 leaves headroom for long URLs and docstring lines that
# black will not split, instead of creating a fight between the two tools.
# ==============================================================================

[tool.black]
line-length = 88
target-version = ["py312"]
# Trailing commas in every call site that fits on one line: a shorter list during
# review, and a one-character diff when an argument is later added.
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 88
# `ai` before `core` is not alphabetical by accident: isort sorts within a section
# only, and the first-party section is declared below.
known_first_party = [
    "accounts",
    "ai",
    "api",
    "assessments",
    "candidates",
    "config",
    "core",
    "employers",
    "interviews",
    "journey",
    "matching",
    "notifications",
]
combine_as_imports = true

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
# Missing imports are ignored because CI installs the requirements before
# running mypy, but a stub package for every third-party dependency is not worth
# maintaining for a five-person team.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
# `disallow_untyped_defs` is deliberately OFF. Turning it on with no annotations
# anywhere in the codebase produces thousands of errors on the first run, and a
# type checker whose first output is a wall of text gets switched off rather than
# worked through. It is switched on per-module as each app is written.
check_untyped_defs = true

[[tool.mypy.overrides]]
# The bias pass is the one module with real type annotations and no Django
# involvement, so it is held to the strictest setting.
module = "ai.bias_pass"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "config.settings.*"
# Settings mutate module-level names by design (SECURE_SSL_REDIRECT = True), which
# mypy reads as incompatible redefinition.
allow_redefinition = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.ci"
python_files = ["test_*.py"]
# Deliberately NOT `tests.py`. Each app package has a `tests.py` placeholder, and
# a default pytest run would collect eleven empty modules and report zero tests
# from them, which reads as a passing suite.
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"